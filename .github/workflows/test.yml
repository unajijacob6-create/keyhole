name: test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  core:
    name: core (typecheck + unit tests, offline fixtures)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
