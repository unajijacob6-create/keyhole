[workspace]
resolver = "2"
members = ["registry", "demo-vault-v1", "demo-vault-v2"]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/unajijacob6-create/keyhole"

[workspace.dependencies]
near-sdk = "5.30"
bs58 = { version = "0.5", default-features = false, features = ["alloc"] }
near-workspaces = "0.24"
tokio = { version = "1", features = ["full"] }
serde_json = "1"
anyhow = "1"

[profile.release]
codegen-units = 1
# Optimize for code size.
opt-level = "z"
lto = true
debug = false
panic = "abort"
# Checked arithmetic in release builds too.
overflow-checks = true
# Drop the `name` custom section so builds are byte-identical across machines.
strip = true
